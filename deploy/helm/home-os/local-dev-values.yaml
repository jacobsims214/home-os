global:
  imageRegistry: "home-os"
  imageTag: latest
  imagePullPolicy: Never

namespace: home-os

envoy:
  enabled: true
  https:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

api:
  replicas: 1
  image: api
  port: 8080
  allowRegistration: "true"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

calendar:
  replicas: 1
  image: calendar
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

worker:
  replicas: 1
  image: worker
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ui:
  replicas: 1
  image: ui
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

typesense:
  replicas: 1
  image: typesense/typesense:27.1
  port: 8108
  persistence:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

tika:
  replicas: 1
  image: apache/tika:latest-full
  port: 9998
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1, memory: 2Gi }

database:
  mode: managed
  managed:
    instances: 1
    storage: 5Gi
    backup:
      enabled: false

secrets:
  jwtSecret: "local-dev-jwt-secret"
  calendarSecret: "local-dev-calendar-secret"
  typesenseApiKey: "local-dev-typesense-key"
  encryptionKey: "local-dev-encryption-key-32-chars"

smtp:
  host: ""
  port: "587"
  username: ""
  password: ""
  from: "noreply@homeos.local"
