global:
  imageRegistry: "host.docker.internal:5001/home-os"
  imageTag: latest
  # Local registry images are rebuilt in place as `latest`.
  allowLatestImageTag: true
  imagePullPolicy: Always
  # Local docker-desktop: publicUrl stays empty = http://localhost:8000 (Envoy).
  allowLocalPublicUrl: true

namespace: home-os

envoy:
  enabled: true
  port: 8000
  https:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

api:
  replicas: 1
  image: api
  port: 8080
  publicUrl: "http://localhost:3000"
  demoMode: true
  allowRegistration: "false"
  adminEmail: "admin@homeos.demo"
  adminPassword: "demo1234"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

calendar:
  replicas: 1
  image: calendar
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

worker:
  replicas: 1
  image: worker
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

mcp:
  replicas: 1
  image: mcp
  port: 8082
  metadataPort: 8083
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

ui:
  replicas: 1
  image: ui
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

typesense:
  replicas: 1
  port: 8108
  persistence:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

tika:
  replicas: 1
  port: 9998
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1, memory: 2Gi }

dex:
  uiRedirectURI: "http://localhost:8000/api/auth/callback"
  replicas: 1
  port: 5556
  grpcPort: 5557
  # Dex reads its DB password from home-os-db-secret (secrets.dbPassword below).
  #
  # Leave the chart default (grpcTLS.enabled=true) if the cluster has
  # cert-manager: the chart then issues a private CA and both certificates and
  # the gRPC admin API is mTLS-only (#697). docker-desktop needs cert-manager
  # installed for that (helm install cert-manager jetstack/cert-manager).
  #
  # Without cert-manager, set grpcTLS.enabled=false. The gRPC admin API is then
  # plaintext, and dex.networkPolicy (on by default) is the only thing limiting
  # port 5557 to the api and mcp pods — which is why the chart refuses to render
  # with both of them off.
  grpcTLS:
    enabled: true

database:
  mode: managed
  managed:
    instances: 1
    storage: 5Gi
    backup:
      enabled: false

secrets:
  jwtSecret: "local-dev-jwt-secret"
  calendarSecret: "local-dev-calendar-secret"
  typesenseApiKey: "local-dev-typesense-key"
  encryptionKey: "local-dev-encryption-key-32-chars"
  # Matches the 'app' user password provisioned in the dev CNPG cluster.
  dbPassword: "wCGVeROLHi1br16yJ5QjRloXH815VrFEbkinBnw1CSygf3DJEtKsGJJjFYFlZsy4"
  adminEmail: "admin@homeos.demo"
  adminPassword: "demo1234"

# SMTP Configuration for sending emails (invites, password reset, notifications).
# Supported: SendGrid, Mailgun, any SMTP provider.
# Set these via environment variables in production:
#   SMTP_HOST:     SMTP server hostname (e.g. smtp.sendgrid.net)
#   SMTP_PORT:     SMTP port (587 for STARTTLS, 465 for SSL)
#   SMTP_USERNAME: SMTP username (e.g. "apikey" for SendGrid)
#   SMTP_PASSWORD: SMTP password or API key
#   SMTP_FROM:     From address for outgoing emails (e.g. "homeos@example.com")
# If SMTP_HOST is empty, email sending is silently skipped.
smtp:
  host: ""
  port: "587"
  username: ""
  password: ""
  from: "noreply@homeos.local"
