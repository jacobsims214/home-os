global:
  imageRegistry: ghcr.io/jacobsims214/home-os
  # One tag for every home-os app image (api, ui, mcp, worker, calendar,
  # migrations): the immutable sha-<short> tag of one release.yml run.
  # `latest` (or empty) fails the render unless allowLatestImageTag, because
  # release.yml only moves `latest` on releases/main (templates/_helpers.tpl,
  # home-os.imageTag).
  imageTag: latest
  # Local docker-desktop only: allow imageTag `latest`/empty. Never set this on
  # a real deployment.
  allowLatestImageTag: false
  # Pull policy for the home-os app images. Always suits a moving tag; use
  # IfNotPresent with an immutable sha-<short> tag.
  imagePullPolicy: Always
  # Pull policy for the pinned third-party images below (envoy, dex, typesense,
  # tika, CNPG postgres). Their tags are exact versions, so the node cache is safe.
  thirdPartyImagePullPolicy: IfNotPresent
  # Public origin of Home OS as browsers and OAuth clients see it
  # (scheme://host[:port], no trailing slash), e.g. https://homeos.example.com.
  # Drives the Dex issuer (<publicUrl>/dex), the home-os-ui redirect URI, the
  # MCP protected-resource URL (<publicUrl>/mcp) and the API/UI/MCP env.
  # Required: empty, localhost or the Argo placeholder fails the render
  # (templates/_helpers.tpl, home-os.publicUrl) unless allowLocalPublicUrl.
  publicUrl: ""
  # Local docker-desktop only: allow an empty/localhost publicUrl (empty =
  # http://localhost:<envoy.port>). Never set this on a real deployment.
  allowLocalPublicUrl: false

namespace: home-os

envoy:
  enabled: true
  # Pinned: runs as uid 101 (the image's envoy user), see templates/envoy.
  image: envoyproxy/envoy:v1.31.10
  port: 8000
  https:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

api:
  replicas: 2
  image: api
  port: 8080
  # Override for PUBLIC_URL; empty = global.publicUrl.
  publicUrl: ""
  allowRegistration: "false"
  # Admin bootstrap credentials live in secrets.adminEmail / secrets.adminPassword.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

calendar:
  replicas: 1
  image: calendar
  port: 8081
  # CalDAV Basic-auth rate limiting (apps/calendar/internal/auth/ratelimit.go).
  # Limited requests get 429 + Retry-After before any bcrypt work.
  auth:
    # Networks of the reverse proxies in front of calendar. X-Forwarded-For is
    # only believed when the TCP peer is in one of these, and then the
    # rightmost hop outside them is the client. Must cover Envoy and the
    # ingress controller (Traefik), i.e. the cluster pod CIDR (Talos default
    # 10.244.0.0/16). Don't add LAN ranges: a client in a trusted range could
    # then pick its own rate-limit key. Empty list = use the TCP peer only.
    trustedProxies:
      - 10.244.0.0/16
    # Requests per client IP per minute through the credential check (burst = half).
    requestsPerMinute: 120
    # Failed password checks per client IP per minute (burst = same).
    failuresPerMinute: 10
    # Failed password checks per account email per hour, across IPs (burst = same).
    accountFailuresPerHour: 30
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

worker:
  replicas: 1
  image: worker
  # Optional email for worker-generated bill_due / maintenance_due
  # notifications. Off by default: notifications are in-app either way and the
  # worker logs once at startup that email is disabled. When enabled, uses
  # smtp.host/port/from/username; if smtp.username is set the password is read
  # from smtp.existingSecret (or secrets.existingSecret), never from values.
  smtp:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

mcp:
  replicas: 1
  image: mcp
  port: 8082
  metadataPort: 8083
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

ui:
  replicas: 2
  image: ui
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Schema migrations Job (templates/migrations/job.yaml): golang-migrate, short-lived.
migrations:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

typesense:
  replicas: 1
  # Pinned. 30.x supports built-in auto-embedding (embed fields with ts/* models)
  # for semantic search. The image has no USER; the chart runs it as uid 10000.
  image: typesense/typesense:30.2
  port: 8108
  persistence:
    size: 10Gi
  # One-time ownership fix for an existing /data volume. Typesense runs as uid
  # 10000, but NFS volumes ignore fsGroup, so data left by an older root-run
  # Typesense (<= 27.1) stays root-owned and 30.x can't write it. When true, an
  # init container chowns /data to 10000:10000 (only if something under it
  # isn't already). It runs as root with CHOWN/FOWNER, which PodSecurity
  # "restricted" forbids: the namespace must allow "baseline" while it is on.
  # Turn it back off after the first successful start.
  fixDataOwnership: false
  fixDataOwnershipImage: busybox:1.37.0
  # Init container above: a find + chown over /data, so it needs very little.
  fixDataOwnershipResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }
  # Typesense keeps its whole index in RAM and also loads the local embedding
  # model ts/all-MiniLM-L12-v2 (#4438: ~128 MB of weights plus ONNX inference
  # buffers). It re-embeds every document when a collection's schema changes,
  # which is CPU-heavy and spikes memory. So: a 512Mi request to cover the model
  # plus a household-sized index, a 2Gi memory limit for re-embed headroom, and
  # no CPU limit (CFS throttling would stall embedding; the 250m request still
  # guarantees a fair share). Raise memory if the index grows past ~1Gi.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

tika:
  replicas: 1
  # Pinned to the exact build (4.2.0-1-full == latest-full as of 2026-11-15).
  # The image runs as uid 35002.
  image: apache/tika:4.2.0-1-full
  port: 9998
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1, memory: 2Gi }

dex:
  # Override for the home-os-ui redirect URI; empty = <global.publicUrl>/api/auth/callback.
  uiRedirectURI: ""
  # Redirect URIs for the home-os-mcp client. Each entry is rendered with tpl,
  # so it may reference the public origin, e.g.
  # '{{ include "home-os.publicUrl" . }}/mcp/oauth/callback'.
  mcpRedirectURIs:
    - "http://127.0.0.1:19876/mcp/oauth/callback"
  replicas: 1
  # Pinned. The image runs as uid 1001.
  image: ghcr.io/dexidp/dex:v2.42.0
  port: 5556
  grpcPort: 5557
  # Ingress NetworkPolicy on the Dex pods (#4682). The gRPC admin API on grpcPort
  # has no authentication (mTLS is #697) and can mint passwords and OAuth
  # clients, so without this any pod in the cluster (e.g. the Moltis agents)
  # could call it. Enforced by any CNI that implements NetworkPolicy (Cilium on
  # Talos); a no-op on a CNI that does not.
  #   grpcPort: only pods whose `app` label is in grpcClientApps (same namespace).
  #   port (HTTP/OIDC): every pod in the namespace (envoy, ui BFF, api, mcp) plus
  #     httpExtraFrom (raw NetworkPolicy peers, e.g. a namespaceSelector).
  # Ingress only: no egress rules and no namespace default-deny are added.
  networkPolicy:
    enabled: true
    # api: CreatePassword (DEX_GRPC_ADDR); mcp: DCR CreateClient. Add any new
    # gRPC caller here or it will be refused.
    grpcClientApps:
      - home-os-api
      - home-os-mcp
    httpExtraFrom: []
  # Dex's Postgres password is never rendered into the ConfigMap: the Deployment
  # reads it from a Secret into DEX_DB_PASSWORD and Dex expands it at startup.
  # existingSecret: Secret holding the password; empty = the database Secret
  #   (database.managed.existingSecret, else the chart's home-os-db-secret).
  # existingSecretPasswordKey: key in dex.existingSecret; empty = "password".
  # (dex.dbPassword was removed; setting it fails the render.)
  existingSecret: ""
  existingSecretPasswordKey: password
  # expiry.refreshTokens.reuseInterval: how long Dex still accepts a refresh
  # token after rotating it, returning the current token instead of rejecting.
  # Needed when ui.replicas > 1: each BFF single-flights refreshes per process
  # only, so two pods can redeem the same token at once. Empty = Dex default (0,
  # no reuse; the losing pod logs the user out).
  refreshTokenReuseInterval: "10s"
  # expiry.idTokens: id_token lifetime (Dex default 24h). Dex keeps one refresh
  # token per user per client and every browser uses the single client
  # home-os-ui, so signing in on a second device revokes the first device's
  # refresh token. The first device keeps working until its id_token expires,
  # then the BFF refresh fails and it is sent to /login once. Longer = fewer
  # forced re-logins on multi-device users, but a stolen id_token stays valid
  # longer. Empty = Dex default (24h).
  idTokenExpiry: "24h"
  # Dex is a small Go binary serving OIDC for a handful of users.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

# Workloads get DB_PASSWORD from a Secret (secretKeyRef) and DATABASE_URL is
# assembled from parts with $(DB_PASSWORD), so no password is rendered into env.
# The password must be URL-safe (or percent-encoded in the Secret).
database:
  mode: managed
  managed:
    # kubernetes.io/basic-auth Secret (keys username=app, password) for the CNPG
    # `app` owner; also read by every workload. Empty = chart renders
    # home-os-db-secret from secrets.dbPassword.
    existingSecret: ""
    instances: 2
    storage: 10Gi
    # CNPG operand image, pinned to an immutable build tag (PostgreSQL 16.16,
    # "system" flavour so barman-cloud backups keep working). Stay on major 16:
    # a major bump needs a CNPG major upgrade, not just a tag change.
    imageName: ghcr.io/cloudnative-pg/postgresql:16.16-202611122305-system-bookworm
    backup:
      enabled: true
      schedule: "0 2 * * *"
  external:
    # Dex connects to the same host/port/user/sslmode but uses its own database
    # named `dex`. Managed mode creates it; in external mode create it yourself
    # (e.g. CREATE DATABASE dex OWNER <user>) before installing.
    host: ""
    port: 5432
    database: homeos
    user: homeos
    sslmode: disable
    # Plain password, only used when existingSecret is empty (rendered into
    # home-os-db-secret). Prefer existingSecret.
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password

secrets:
  # Name of a pre-created Secret with keys jwtSecret, calendarSecret,
  # typesenseApiKey, encryptionKey, adminEmail, adminPassword (and smtpPassword
  # unless smtp.existingSecret is set). When set, home-os-secrets is not
  # rendered and the plain values below are ignored.
  existingSecret: ""
  jwtSecret: ""
  calendarSecret: ""
  typesenseApiKey: ""
  encryptionKey: ""
  # Password for the 'app' Postgres user (managed mode), rendered into
  # home-os-db-secret only when database.managed.existingSecret is empty.
  dbPassword: ""
  adminEmail: ""
  adminPassword: ""

smtp:
  host: ""
  port: "587"
  username: ""
  # Plain password, stored in home-os-secrets (key smtpPassword) when neither
  # smtp.existingSecret nor secrets.existingSecret is set.
  password: ""
  # Secret holding the SMTP password; empty = home-os.secretsName, key smtpPassword.
  existingSecret: ""
  existingSecretPasswordKey: password
  from: "noreply@homeos.local"

ingress:
  enabled: false
  className: traefik
  # Empty = the host of global.publicUrl.
  host: ""
  tlsEnabled: true
  tlsSecret: simstech-wildcard-tls
  annotations: {}
