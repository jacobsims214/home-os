global:
  imageRegistry: ghcr.io/jacobsims214/home-os
  imageTag: latest
  imagePullPolicy: Always

namespace: home-os

envoy:
  enabled: true
  port: 8000
  https:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

api:
  replicas: 2
  image: api
  port: 8080
  publicUrl: "http://localhost:3000"
  allowRegistration: "false"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

calendar:
  replicas: 1
  image: calendar
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

worker:
  replicas: 1
  image: worker
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

mcp:
  replicas: 1
  image: mcp
  port: 8082
  metadataPort: 8083
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

ui:
  replicas: 2
  image: ui
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

typesense:
  replicas: 1
  image: typesense/typesense:27.1
  port: 8108
  persistence:
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

tika:
  replicas: 1
  image: apache/tika:latest-full
  port: 9998
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1, memory: 2Gi }

dex:
  replicas: 1
  image: dex
  port: 5556
  grpcPort: 5557
  # Database password for Dex's Postgres storage backend.
  # Must be set at deploy time. For production, use --set or a secure values file.
  # WARNING: The original password was committed to git; rotate it as part of this fix.
  dbPassword: ""

database:
  mode: managed
  managed:
    instances: 2
    storage: 10Gi
    backup:
      enabled: true
      schedule: "0 2 * * *"
  external:
    host: ""
    port: 5432
    database: homeos
    user: homeos
    password: ""
    existingSecret: ""

secrets:
  jwtSecret: ""
  calendarSecret: ""
  typesenseApiKey: ""
  encryptionKey: ""
  # Password for the 'app' Postgres user. Must match what is provisioned in the
  # database. For managed mode, the CNPG cluster is bootstrapped with this secret.
  # WARNING: The original password was committed to git; rotate it as part of this fix.
  dbPassword: ""
  dbPassword: ""

smtp:
  host: ""
  port: "587"
  username: ""
  password: ""
  from: "noreply@homeos.local"

ingress:
  enabled: false
  className: traefik
  host: homeos.simstech.cloud
  tlsEnabled: true
  tlsSecret: simstech-wildcard-tls
  annotations: {}
