global:
  imageRegistry: ghcr.io/jacobsims214/home-os
  imageTag: latest
  imagePullPolicy: Always
  # Public origin of Home OS as browsers and OAuth clients see it
  # (scheme://host[:port], no trailing slash), e.g. https://homeos.example.com.
  # Drives the Dex issuer (<publicUrl>/dex), the home-os-ui redirect URI, the
  # MCP protected-resource URL (<publicUrl>/mcp) and the API/UI/MCP env.
  # Empty = http://localhost:<envoy.port> for local docker-desktop.
  publicUrl: ""

namespace: home-os

envoy:
  enabled: true
  port: 8000
  https:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

api:
  replicas: 2
  image: api
  port: 8080
  # Override for PUBLIC_URL; empty = global.publicUrl.
  publicUrl: ""
  allowRegistration: "false"
  adminEmail: ""
  adminPassword: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

calendar:
  replicas: 1
  image: calendar
  port: 8081
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

worker:
  replicas: 1
  image: worker
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

mcp:
  replicas: 1
  image: mcp
  port: 8082
  metadataPort: 8083
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

ui:
  replicas: 2
  image: ui
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

typesense:
  replicas: 1
  image: typesense/typesense:27.1
  port: 8108
  persistence:
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

tika:
  replicas: 1
  image: apache/tika:latest-full
  port: 9998
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1, memory: 2Gi }

dex:
  # Override for the home-os-ui redirect URI; empty = <global.publicUrl>/api/auth/callback.
  uiRedirectURI: ""
  # Redirect URIs for the home-os-mcp client. Each entry is rendered with tpl,
  # so it may reference the public origin, e.g.
  # '{{ include "home-os.publicUrl" . }}/mcp/oauth/callback'.
  mcpRedirectURIs:
    - "http://127.0.0.1:19876/mcp/oauth/callback"
  replicas: 1
  image: dex
  port: 5556
  grpcPort: 5557
  # Dex's Postgres password is never rendered into the ConfigMap: the Deployment
  # reads it from a Secret into DEX_DB_PASSWORD and Dex expands it at startup.
  # existingSecret: Secret holding the password; empty = the chart's
  #   home-os-db-secret (the `app` user password from secrets.dbPassword).
  # existingSecretPasswordKey: key in that Secret; empty = "password".
  # (dex.dbPassword was removed; setting it fails the render.)
  existingSecret: ""
  existingSecretPasswordKey: password

database:
  mode: managed
  managed:
    instances: 2
    storage: 10Gi
    backup:
      enabled: true
      schedule: "0 2 * * *"
  external:
    host: ""
    port: 5432
    database: homeos
    user: homeos
    password: ""
    existingSecret: ""

secrets:
  jwtSecret: ""
  calendarSecret: ""
  typesenseApiKey: ""
  encryptionKey: ""
  # Password for the 'app' Postgres user. Must match what is provisioned in the
  # database. For managed mode, the CNPG cluster is bootstrapped with this secret.
  # WARNING: The original password was committed to git; rotate it as part of this fix.
  dbPassword: ""
  adminEmail: ""
  adminPassword: ""

smtp:
  host: ""
  port: "587"
  username: ""
  password: ""
  from: "noreply@homeos.local"

ingress:
  enabled: false
  className: traefik
  host: homeos.simstech.cloud
  tlsEnabled: true
  tlsSecret: simstech-wildcard-tls
  annotations: {}
