apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-os-typesense
  namespace: {{ .Values.namespace }}
  labels:
    app: home-os-typesense
spec:
  replicas: {{ .Values.typesense.replicas }}
  selector:
    matchLabels:
      app: home-os-typesense
  serviceName: home-os-typesense
  template:
    metadata:
      labels:
        app: home-os-typesense
    spec:
      {{- include "home-os.podSecurityContext" (dict "uid" 10000) | nindent 6 }}
      {{- if .Values.typesense.fixDataOwnership }}
      # One-time fix (typesense.fixDataOwnership): NFS ignores fsGroup, so data
      # written by older root-run Typesense stays root-owned. Runs as root, so
      # the namespace must allow PodSecurity "baseline" while it is on.
      initContainers:
      - name: fix-data-ownership
        image: "{{ .Values.typesense.fixDataOwnershipImage }}"
        imagePullPolicy: {{ .Values.global.thirdPartyImagePullPolicy }}
        command:
        - sh
        - -c
        - |
          if [ -n "$(find /data \( ! -user 10000 -o ! -group 10000 \) -print | head -n 1)" ]; then
            echo "chown -R 10000:10000 /data"
            chown -R 10000:10000 /data
          else
            echo "/data already owned by 10000:10000"
          fi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "FOWNER"]
        resources:
          {{- toYaml .Values.typesense.fixDataOwnershipResources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
      {{- end }}
      containers:
      - name: typesense
        image: "{{ .Values.typesense.image }}"
        imagePullPolicy: {{ .Values.global.thirdPartyImagePullPolicy }}
        {{- include "home-os.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: {{ .Values.typesense.port }}
        env:
        - name: TYPESENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.secretsName" . }}
              key: typesenseApiKey
        - name: TYPESENSE_DATA_DIR
          value: /data
        resources:
          {{- toYaml .Values.typesense.resources | nindent 10 }}
        volumeMounts:
        {{- include "home-os.tmpVolumeMount" . | nindent 8 }}
        - name: data
          mountPath: /data
      volumes:
      {{- include "home-os.tmpVolume" . | nindent 6 }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.typesense.persistence.size }}
