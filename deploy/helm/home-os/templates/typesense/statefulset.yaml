apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-os-typesense
  namespace: {{ .Values.namespace }}
  labels:
    app: home-os-typesense
spec:
  replicas: {{ .Values.typesense.replicas }}
  selector:
    matchLabels:
      app: home-os-typesense
  serviceName: home-os-typesense
  template:
    metadata:
      labels:
        app: home-os-typesense
    spec:
      {{- include "home-os.podSecurityContext" (dict "uid" 10000) | nindent 6 }}
      containers:
      - name: typesense
        image: "{{ .Values.typesense.image }}"
        imagePullPolicy: {{ .Values.global.thirdPartyImagePullPolicy }}
        {{- include "home-os.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: {{ .Values.typesense.port }}
        env:
        - name: TYPESENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.secretsName" . }}
              key: typesenseApiKey
        - name: TYPESENSE_DATA_DIR
          value: /data
        volumeMounts:
        {{- include "home-os.tmpVolumeMount" . | nindent 8 }}
        - name: data
          mountPath: /data
      volumes:
      {{- include "home-os.tmpVolume" . | nindent 6 }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.typesense.persistence.size }}
