{{- if .Values.dex.dbPassword }}
{{- fail "dex.dbPassword was removed: Dex reads its DB password from a Secret. Put it in a Secret and set dex.existingSecret (and dex.existingSecretPasswordKey), or leave both unset to use home-os-db-secret." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-os-dex-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    issuer: {{ include "home-os.dexIssuer" . }}
    
    storage:
      type: postgres
      config:
        host: home-os-postgres-rw
        port: 5432
        database: dex
        user: app
        # Expanded by Dex at startup from the DEX_DB_PASSWORD env var, which the
        # Deployment sources from a Secret (dex.existingSecret). Never inline it here.
        password: $DEX_DB_PASSWORD
        ssl:
          # SSL mode is "disable" because the CNPG cluster does not currently
          # configure TLS for client connections. Revisit if TLS is enabled
          # in the postgres cluster spec.
          mode: disable
    
    web:
      http: 0.0.0.0:5556
    
    grpc:
      addr: 0.0.0.0:5557
    
    oauth2:
      skipApprovalScreen: true
      alwaysShowLoginScreen: false
    
    staticClients:
    - id: home-os-ui
      name: Home OS UI
      redirectURIs:
      - {{ include "home-os.uiRedirectURI" . | quote }}
      public: true
    - id: home-os-mcp
      name: Home OS MCP
      public: true
      redirectURIs:
      {{- range .Values.dex.mcpRedirectURIs }}
      - {{ tpl . $ | quote }}
      {{- end }}
    
    enablePasswordDB: true