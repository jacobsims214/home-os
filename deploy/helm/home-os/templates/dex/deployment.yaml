apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-os-dex
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.dex.replicas }}
  selector:
    matchLabels:
      app: home-os-dex
  template:
    metadata:
      labels:
        app: home-os-dex
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dex/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: dex
        image: ghcr.io/dexidp/dex:v2.42.0
        args: ["dex", "serve", "/etc/dex/config.yaml"]
        ports:
        - containerPort: 5556
          name: http
        - containerPort: 5557
          name: grpc
        env:
        # Dex expands $VARS in config.yaml (storage section) when this is true.
        - name: DEX_EXPAND_ENV
          value: "true"
        - name: DEX_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- if .Values.dex.existingSecret }}
              name: {{ .Values.dex.existingSecret }}
              key: {{ .Values.dex.existingSecretPasswordKey | default "password" }}
              {{- else }}
              name: {{ include "home-os.dbSecretName" . }}
              key: {{ include "home-os.dbSecretPasswordKey" . }}
              {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/dex
      volumes:
      - name: config
        configMap:
          name: home-os-dex-config