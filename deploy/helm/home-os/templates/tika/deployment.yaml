apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-os-tika
  namespace: {{ .Values.namespace }}
  labels:
    app: home-os-tika
spec:
  replicas: {{ .Values.tika.replicas }}
  selector:
    matchLabels:
      app: home-os-tika
  template:
    metadata:
      labels:
        app: home-os-tika
    spec:
      {{- include "home-os.podSecurityContext" (dict "uid" 35002) | nindent 6 }}
      containers:
      - name: tika
        image: "{{ .Values.tika.image }}"
        imagePullPolicy: {{ .Values.global.thirdPartyImagePullPolicy }}
        {{- include "home-os.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: {{ .Values.tika.port }}
        volumeMounts:
        {{- include "home-os.tmpVolumeMount" . | nindent 8 }}
        resources:
          {{- toYaml .Values.tika.resources | nindent 10 }}
      volumes:
      {{- include "home-os.tmpVolume" . | nindent 6 }}
