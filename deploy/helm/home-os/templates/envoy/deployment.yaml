apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-os-envoy
  namespace: {{ .Values.namespace }}
  labels:
    app: home-os-envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-os-envoy
  template:
    metadata:
      labels:
        app: home-os-envoy
    spec:
      {{- include "home-os.podSecurityContext" (dict "uid" 101) | nindent 6 }}
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.31-latest
        {{- include "home-os.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: 8080
        volumeMounts:
        {{- include "home-os.tmpVolumeMount" . | nindent 8 }}
        - name: config
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      {{- include "home-os.tmpVolume" . | nindent 6 }}
      - name: config
        configMap:
          name: envoy-config
