{{- $rl := .Values.envoy.dexLoginRateLimit }}
{{- $trusted := .Values.envoy.trustedProxies | default .Values.api.rateLimit.trustedProxies }}
{{- if and $rl.enabled (not $trusted) }}
{{- fail "envoy.dexLoginRateLimit needs envoy.trustedProxies or api.rateLimit.trustedProxies" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: {{ .Values.namespace }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              # RFC 3986 normalization (dot segments, duplicate slashes) before
              # route matching, so /dex//auth or /dex/x/../auth still hit the
              # Dex login rate limit below.
              normalize_path: true
              merge_slashes: true
              {{- if $rl.enabled }}
              # Client address = rightmost X-Forwarded-For hop outside the
              # trusted proxies (envoy.trustedProxies, default
              # api.rateLimit.trustedProxies). Used only as the rate-limit key:
              # use_remote_address stays false, so XFF and X-Forwarded-Proto
              # still pass through to the upstreams unchanged.
              original_ip_detection_extensions:
              - name: envoy.extensions.http.original_ip_detection.xff
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.original_ip_detection.xff.v3.XffConfig
                  xff_trusted_cidrs:
                    cidrs:
                    {{- range $trusted }}
                    {{- $parts := split "/" . }}
                    - { address_prefix: {{ $parts._0 | quote }}, prefix_len: {{ $parts._1 | default (ternary "128" "32" (contains ":" $parts._0)) }} }
                    {{- end }}
              {{- end }}
              {{- if $rl.enabled }}
              # ANY 429 is a page a person reads, never Envoy's bare local-reply
              # body (#5407).
              #
              # The only 429 this proxy produces is the Dex login throttle above,
              # and it is produced as a LOCAL REPLY: the request never reaches
              # Dex or the UI, so no application code -- not the login page, not
              # an error boundary -- ever runs on it. That is why the app-side
              # work in this same ticket (lib/auth/login-surface.ts, the login
              # page's rate-limit state) could not fix the reported symptom on
              # its own: the person's browser was rendering `local_rate_limited`,
              # Envoy's own body text, on a blank page with no form and no
              # explanation.
              #
              # The body is written out in full here because it is served by the
              # proxy, so it can borrow nothing from the app: no stylesheet, no
              # font, no component. Colours are the app's light-mode tokens
              # (apps/ui/app/globals.css) inlined, and the wording matches
              # RATE_LIMIT_COPY in lib/auth/login-surface.ts so the two surfaces
              # say the same thing.
              #
              # It is a 429, not a 200 or a 303: the status is honest, so a
              # monitoring rule or an API client still sees the throttle. Only
              # the presentation changes. The limiter itself is untouched.
              local_reply_config:
                mappers:
                - filter:
                    status_code_filter:
                      comparison:
                        op: EQ
                        value: { default_value: 429 }
                  body_format_override:
                    content_type: "text/html; charset=utf-8"
                    text_format_source:
                      inline_string: |
                        <!doctype html>
                        <html lang="en">
                        <head>
                        <meta charset="utf-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1">
                        <meta name="robots" content="noindex">
                        <title>Too many sign-in attempts &mdash; Home OS</title>
                        <style>
                          :root { color-scheme: light dark; }
                          * { box-sizing: border-box; }
                          body { margin: 0; background: #f8f9fa; color: #212529;
                                 font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
                          .stand { min-height: 100dvh; display: flex; flex-direction: column;
                                   align-items: center; justify-content: flex-start;
                                   padding: calc(24px + env(safe-area-inset-top, 0px)) 16px
                                            calc(24px + env(safe-area-inset-bottom, 0px)); }
                          .brand { display: flex; align-items: center; gap: 10px;
                                   margin-bottom: 24px; font-size: 18px; font-weight: 600;
                                   letter-spacing: -0.01em; }
                          .mark { width: 36px; height: 36px; border-radius: 10px; background: #0b7285;
                                  display: grid; place-items: center; color: #fff; }
                          .mark svg { width: 20px; height: 20px; }
                          main { width: 100%; max-width: 420px; }
                          .card h1 { margin: 0; font-size: 24px; line-height: 1.15;
                                     font-weight: 600; letter-spacing: -0.015em; }
                          .sub { margin: 6px 0 20px; font-size: 15px; color: #495057; }
                          .warn { display: flex; gap: 12px; margin: 0 0 20px; padding: 14px;
                                  border: 1px solid #ffd8a8; border-radius: 12px;
                                  background: #fff4e6; color: #8a3c00; }
                          .warn svg { flex: 0 0 auto; width: 20px; height: 20px; margin-top: 2px; }
                          .warn p { margin: 0; }
                          .warn strong { display: block; font-weight: 600; }
                          .warn span { display: block; margin-top: 2px; font-size: 13px; line-height: 1.4; }
                          .btn { display: flex; align-items: center; justify-content: center;
                                 width: 100%; min-height: 48px; padding: 0 16px; border: 0;
                                 border-radius: 8px; background: #0b7285; color: #fff;
                                 font: inherit; font-size: 15px; font-weight: 600;
                                 text-decoration: none; cursor: pointer; }
                          .btn:focus-visible { outline: 3px solid #66d9e8; outline-offset: 2px; }
                          .alt { margin: 20px 0 0; text-align: center; font-size: 14px; color: #495057; }
                          .foot { margin-top: 16px; text-align: center; font-size: 12px; color: #636a71; }
                          @media (min-width: 768px) {
                            .stand { justify-content: center; padding: 40px 24px; }
                            .card { padding: 32px; border: 1px solid #e2e6ea; border-radius: 16px;
                                    background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
                          }
                          @media (prefers-color-scheme: dark) {
                            body { background: #1f1f1f; color: #e9ecef; }
                            .sub, .alt { color: #c1c2c5; }
                            .foot { color: #9d9fa3; }
                            .warn { border-color: #5c4320; background: #3a2a14; color: #ffd8a8; }
                            .btn { background: #0b7285; }
                            @media (min-width: 768px) {
                              .card { border-color: #3a3a3a; background: #242424;
                                      box-shadow: 0 1px 2px rgba(0,0,0,.4); }
                            }
                          }
                        </style>
                        </head>
                        <body>
                        <div class="stand">
                          <div class="brand">
                            <span class="mark" aria-hidden="true">
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                   stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/>
                              </svg>
                            </span>
                            <span>Home OS</span>
                          </div>
                          <main class="card" data-auth-page="rate-limited">
                            <h1>Too many sign-in attempts</h1>
                            <p class="sub">Sign-in is paused for a moment</p>
                            <div class="warn" role="alert">
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 9v4M12 17v.01"/>
                                <path d="M10.3 4.2 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/>
                              </svg>
                              <p>
                                <strong>Too many sign-in attempts</strong>
                                <span>Sign-in is paused for about {{ int $rl.retryAfterSeconds }} seconds to protect your
                                family&#39;s account from password guessing. Wait a moment, then try again.</span>
                              </p>
                            </div>
                            <a class="btn" href="/login">Try signing in again</a>
                            <p class="alt">Still stuck? Wait a full minute &mdash; the pause lifts on its own.</p>
                          </main>
                          <p class="foot">Home OS &middot; self-hosted</p>
                        </div>
                        </body>
                        </html>
                  headers_to_add:
                  # A client (or an operator) can read how long to wait without
                  # parsing the page. Envoy's own local replies do not pass
                  # through the router, so the route's retry-after above is not
                  # guaranteed to be applied here.
                  - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    header: { key: retry-after, value: {{ int $rl.retryAfterSeconds | quote }} }
                  - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    header: { key: cache-control, value: "no-store" }
              {{- end }}
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/api/auth" }
                    route: { cluster: ui_cluster }
                  - match: { prefix: "/api/" }
                    route: { cluster: api_cluster }
                  - match: { prefix: "/dav/" }
                    route: { cluster: calendar_cluster }
                  - match: { prefix: "/.well-known/oauth-authorization-server" }
                    route:
                      cluster: mcp_metadata_cluster
                      timeout: 0s
                  - match: { prefix: "/.well-known/oauth-protected-resource" }
                    route:
                      cluster: mcp_metadata_cluster
                      timeout: 0s
                  - match: { prefix: "/.well-known/openid-configuration" }
                    route:
                      prefix_rewrite: "/dex/.well-known/openid-configuration"
                      cluster: dex_cluster
                      timeout: 0s
                  - match: { prefix: "/.well-known/" }
                    route: { cluster: calendar_cluster }
                  # The MCP transport is stateless POST at exactly /mcp (no
                  # SSE). A "/mcp/" prefix does not match the bare path, so it
                  # needs its own exact route or it falls through to the UI.
                  - match: { path: "/mcp" }
                    route:
                      cluster: mcp_cluster
                      timeout: 0s
                      idle_timeout: 0s
                  # /mcp/health and /mcp/.well-known/oauth-protected-resource.
                  - match: { prefix: "/mcp/" }
                    route:
                      cluster: mcp_cluster
                      timeout: 0s
                      idle_timeout: 0s
                  {{- if $rl.enabled }}
                  # Dex login (authorize, /dex/auth/local, the password POST to
                  # /dex/auth/local/login): per-client token bucket, 429 when
                  # empty (#4686). Must come before the /dex/ catch-all. Token,
                  # keys, userinfo and discovery stay on the unlimited route.
                  - match: { prefix: "/dex/auth" }
                    route:
                      cluster: dex_cluster
                      timeout: 0s
                    typed_per_filter_config:
                      envoy.filters.http.local_ratelimit:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                        stat_prefix: dex_login
                        filter_enabled:
                          default_value: { numerator: 100, denominator: HUNDRED }
                        filter_enforced:
                          default_value: { numerator: 100, denominator: HUNDRED }
                        # Only the per-client buckets limit. The route bucket is
                        # required by Envoy, but it applies only to a request
                        # that matched no descriptor, and every request has an
                        # address.
                        always_consume_default_token_bucket: false
                        token_bucket:
                          max_tokens: {{ mul (int $rl.burst) 100 }}
                          tokens_per_fill: {{ mul (int $rl.requestsPerMinute) 100 }}
                          fill_interval: 60s
                        max_dynamic_descriptors: {{ int $rl.maxClients }}
                        rate_limits:
                        - actions:
                          - masked_remote_address:
                              v4_prefix_mask_len: 32
                              v6_prefix_mask_len: {{ int $rl.ipv6PrefixLen }}
                        descriptors:
                        # No value: one bucket per distinct client address.
                        - entries:
                          - key: masked_remote_address
                          token_bucket:
                            max_tokens: {{ int $rl.burst }}
                            tokens_per_fill: {{ int $rl.requestsPerMinute }}
                            fill_interval: 60s
                        response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header: { key: retry-after, value: "60" }
                  {{- end }}
                  - match: { prefix: "/dex/" }
                    route:
                      cluster: dex_cluster
                      timeout: 0s
                  # OAuth endpoints served by the MCP metadata server live under
                  # /oauth/ so they never shadow UI pages (the UI owns /register).
                  # The metadata server advertises these URLs in its RFC 8414
                  # document; Envoy rewrites them to the server's handler paths.
                  #
                  # /oauth/authorize injects the openid scope (MCP clients often
                  # omit it, Dex requires it) and 302s to /dex/auth.
                  - match: { path: "/oauth/authorize" }
                    route:
                      prefix_rewrite: "/authorize"
                      cluster: mcp_metadata_cluster
                      timeout: 0s
                  # /oauth/register is RFC 7591 dynamic client registration: MCP
                  # clients POST their redirect URIs to obtain a client_id.
                  - match: { path: "/oauth/register" }
                    route:
                      prefix_rewrite: "/register"
                      cluster: mcp_metadata_cluster
                      timeout: 0s
                  # Legacy aliases for MCP images that still advertise the root
                  # paths. Kept narrow so they cannot shadow UI pages: only an
                  # exact /authorize (no UI page), and only a JSON POST to
                  # /register (the UI page is a GET).
                  - match: { path: "/authorize" }
                    route:
                      cluster: mcp_metadata_cluster
                      timeout: 0s
                  - match:
                      path: "/register"
                      headers:
                      - name: ":method"
                        string_match: { exact: "POST" }
                      - name: "content-type"
                        string_match: { prefix: "application/json" }
                    route:
                      cluster: mcp_metadata_cluster
                      timeout: 0s
                  # Root aliases for Dex endpoints. Exact paths, so they do not
                  # swallow UI routes that merely start with these words.
                  - match: { path: "/token" }
                    route:
                      prefix_rewrite: "/dex/token"
                      cluster: dex_cluster
                  - match: { path: "/device/code" }
                    route:
                      prefix_rewrite: "/dex/device/code"
                      cluster: dex_cluster
                  - match: { path: "/keys" }
                    route:
                      prefix_rewrite: "/dex/keys"
                      cluster: dex_cluster
                  - match: { path: "/userinfo" }
                    route:
                      prefix_rewrite: "/dex/userinfo"
                      cluster: dex_cluster
                  # Next.js BFF route handlers (apps/ui/app/bff). Explicit so no
                  # earlier rule can claim them.
                  - match: { prefix: "/bff/" }
                    route: { cluster: ui_cluster }
                  - match: { prefix: "/" }
                    route: { cluster: ui_cluster }
              http_filters:
              {{- if $rl.enabled }}
              # No-op unless a route enables it (only the Dex login route does).
              - name: envoy.filters.http.local_ratelimit
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                  stat_prefix: http_local_rate_limiter
              {{- end }}
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: api_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: api_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-api, port_value: 8080 }
      - name: calendar_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: calendar_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-calendar, port_value: 8081 }
      - name: ui_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: ui_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-ui, port_value: 3000 }
      - name: dex_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: dex_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-dex, port_value: 5556 }
      - name: mcp_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: mcp_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-mcp, port_value: 8082 }
      - name: mcp_metadata_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: mcp_metadata_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-mcp, port_value: 8083 }
