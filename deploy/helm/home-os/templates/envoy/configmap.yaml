apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: {{ .Values.namespace }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/api/auth" }
                    route: { cluster: ui_cluster }
                  - match: { prefix: "/api/" }
                    route: { cluster: api_cluster }
                  - match: { prefix: "/dav/" }
                    route: { cluster: calendar_cluster }
                  - match: { prefix: "/.well-known/" }
                    route: { cluster: calendar_cluster }
                  - match: { prefix: "/" }
                    route: { cluster: ui_cluster }
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: api_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: api_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-api, port_value: 8080 }
      - name: calendar_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: calendar_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-calendar, port_value: 8081 }
      - name: ui_cluster
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        connect_timeout: 5s
        load_assignment:
          cluster_name: ui_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: home-os-ui, port_value: 3000 }
