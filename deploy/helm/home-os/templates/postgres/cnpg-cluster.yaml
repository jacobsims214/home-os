{{- if eq .Values.database.mode "managed" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-os-postgres
  namespace: {{ .Values.namespace }}
spec:
  instances: {{ .Values.database.managed.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: {{ .Values.database.managed.storage }}
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: home-os-db-secret
  managed:
    roles:
    - name: app
      login: true
      superuser: false
      inherit: true
      createdb: true
      createrole: false
      ensure: present
{{- end }}
