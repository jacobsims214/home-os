apiVersion: v1
kind: Secret
metadata:
  name: home-os-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  calendarSecret: {{ .Values.secrets.calendarSecret | quote }}
  typesenseApiKey: {{ .Values.secrets.typesenseApiKey | quote }}
  encryptionKey: {{ .Values.secrets.encryptionKey | quote }}
  adminEmail: {{ .Values.secrets.adminEmail | quote }}
  adminPassword: {{ .Values.secrets.adminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: home-os-db-secret
  namespace: {{ .Values.namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: {{ .Values.secrets.dbPassword | quote }}
