{{- /*
Chart-owned Secrets. Each is rendered only when its existingSecret override is
empty; with every override set, this file renders nothing.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: home-os-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  calendarSecret: {{ .Values.secrets.calendarSecret | quote }}
  typesenseApiKey: {{ .Values.secrets.typesenseApiKey | quote }}
  encryptionKey: {{ .Values.secrets.encryptionKey | quote }}
  adminEmail: {{ .Values.secrets.adminEmail | quote }}
  adminPassword: {{ .Values.secrets.adminPassword | quote }}
  {{- if not .Values.smtp.existingSecret }}
  smtpPassword: {{ .Values.smtp.password | quote }}
  {{- end }}
  {{- if and (not .Values.agentCredentials.existingSecret) .Values.agentCredentials.key }}
  agentCredentialsKey: {{ .Values.agentCredentials.key | quote }}
  {{- end }}
{{- end }}
{{- if include "home-os.renderDbSecret" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: home-os-db-secret
  namespace: {{ .Values.namespace }}
  annotations:
    # Argo CD: read by the CNPG Cluster (wave -2) and the migrations Job (wave -1).
    argocd.argoproj.io/sync-wave: "-3"
type: kubernetes.io/basic-auth
stringData:
  {{- if eq .Values.database.mode "managed" }}
  username: app
  password: {{ .Values.secrets.dbPassword | quote }}
  {{- else }}
  username: {{ .Values.database.external.user | quote }}
  password: {{ .Values.database.external.password | quote }}
  {{- end }}
{{- end }}
