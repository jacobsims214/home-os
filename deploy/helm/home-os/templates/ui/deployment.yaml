apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-os-ui
  namespace: {{ .Values.namespace }}
  labels:
    app: home-os-ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: home-os-ui
  template:
    metadata:
      labels:
        app: home-os-ui
    spec:
      {{- include "home-os.podSecurityContext" (dict "uid" 100 "gid" 101) | nindent 6 }}
      containers:
      - name: ui
        image: "{{ .Values.global.imageRegistry }}/ui:{{ include "home-os.imageTag" . }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- include "home-os.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: {{ .Values.ui.port }}
        env:
        - name: NODE_ENV
          value: "production"
        - name: API_URL
          value: {{ include "home-os.apiInternalUrl" . | quote }}
        # Server-side /bff proxy target (#4393).
        - name: API_INTERNAL_URL
          value: {{ include "home-os.apiInternalUrl" . | quote }}
        - name: PUBLIC_URL
          value: {{ include "home-os.publicUrl" . | quote }}
        - name: DEX_ISSUER
          value: {{ include "home-os.dexIssuer" . | quote }}
        - name: DEX_UI_REDIRECT_URI
          value: {{ include "home-os.uiRedirectURI" . | quote }}
        volumeMounts:
        {{- include "home-os.tmpVolumeMount" . | nindent 8 }}
        - name: next-cache
          mountPath: /app/.next/cache
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
      volumes:
      {{- include "home-os.tmpVolume" . | nindent 6 }}
      - name: next-cache
        emptyDir: {}
