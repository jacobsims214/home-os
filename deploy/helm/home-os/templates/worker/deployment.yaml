apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-os-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: home-os-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: home-os-worker
  template:
    metadata:
      labels:
        app: home-os-worker
    spec:
      {{- include "home-os.podSecurityContext" (dict "uid" 65532) | nindent 6 }}
      containers:
      - name: worker
        image: "{{ .Values.global.imageRegistry }}/worker:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- include "home-os.containerSecurityContext" . | nindent 8 }}
        env:
        {{- include "home-os.databaseEnv" . | nindent 8 }}
        - name: TYPESENSE_HOST
          value: home-os-typesense
        - name: TYPESENSE_PORT
          value: "{{ .Values.typesense.port }}"
        - name: TYPESENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.secretsName" . }}
              key: typesenseApiKey
        - name: POLL_INTERVAL
          value: "5s"
        - name: TIKA_URL
          value: "http://home-os-tika:{{ .Values.tika.port }}"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        {{- include "home-os.tmpVolumeMount" . | nindent 8 }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
      volumes:
      {{- include "home-os.tmpVolume" . | nindent 6 }}
