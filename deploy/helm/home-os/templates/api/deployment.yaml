apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-os-api
  namespace: {{ .Values.namespace }}
  labels:
    app: home-os-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: home-os-api
  template:
    metadata:
      labels:
        app: home-os-api
    spec:
      containers:
      - name: api
        image: "{{ .Values.global.imageRegistry }}/api:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.api.port }}
        env:
        - name: PORT
          value: "{{ .Values.api.port }}"
        - name: DATABASE_URL
          value: {{ include "home-os.databaseUrl" . | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: home-os-secrets
              key: jwtSecret
        - name: TYPESENSE_HOST
          value: home-os-typesense
        - name: TYPESENSE_PORT
          value: "{{ .Values.typesense.port }}"
        - name: TYPESENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: home-os-secrets
              key: typesenseApiKey
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: home-os-secrets
              key: encryptionKey
        - name: LOG_LEVEL
          value: "info"
        - name: DEMO_MODE
          value: {{ .Values.api.demoMode | default "false" | quote }}
        - name: PUBLIC_URL
          value: "{{ .Values.api.publicUrl }}"
        - name: ALLOW_REGISTRATION
          value: "{{ .Values.api.allowRegistration }}"
        - name: SMTP_HOST
          value: "{{ .Values.smtp.host }}"
        - name: SMTP_PORT
          value: "{{ .Values.smtp.port }}"
        - name: SMTP_USERNAME
          value: "{{ .Values.smtp.username }}"
        - name: SMTP_PASSWORD
          value: "{{ .Values.smtp.password }}"
        - name: SMTP_FROM
          value: "{{ .Values.smtp.from }}"
        - name: DEX_GRPC_ADDR
          value: "home-os-dex:5557"
        - name: DEX_JWKS_URL
          value: "http://home-os-envoy.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.envoy.port }}/dex/keys"
        - name: DEX_ISSUER
          value: "http://localhost:8000/dex"
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: home-os-secrets
              key: adminEmail
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: home-os-secrets
              key: adminPassword
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
