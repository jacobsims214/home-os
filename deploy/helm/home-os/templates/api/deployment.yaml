apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-os-api
  namespace: {{ .Values.namespace }}
  labels:
    app: home-os-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: home-os-api
  template:
    metadata:
      labels:
        app: home-os-api
    spec:
      {{- include "home-os.podSecurityContext" (dict "uid" 65532) | nindent 6 }}
      containers:
      - name: api
        image: "{{ .Values.global.imageRegistry }}/api:{{ include "home-os.imageTag" . }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- include "home-os.containerSecurityContext" . | nindent 8 }}
        ports:
        - containerPort: {{ .Values.api.port }}
        env:
        - name: PORT
          value: "{{ .Values.api.port }}"
        {{- include "home-os.databaseEnv" . | nindent 8 }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.secretsName" . }}
              key: jwtSecret
        - name: TYPESENSE_HOST
          value: home-os-typesense
        - name: TYPESENSE_PORT
          value: "{{ .Values.typesense.port }}"
        - name: TYPESENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.secretsName" . }}
              key: typesenseApiKey
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.secretsName" . }}
              key: encryptionKey
        {{- include "home-os.agentCredentialsEnv" . | nindent 8 }}
        - name: LOG_LEVEL
          value: "info"
        - name: DEMO_MODE
          value: {{ .Values.api.demoMode | default "false" | quote }}
        - name: PUBLIC_URL
          value: {{ include "home-os.apiPublicUrl" . | quote }}
        - name: ALLOW_REGISTRATION
          value: "{{ .Values.api.allowRegistration }}"
        # CORS accepts localhost origins only on local docker-desktop.
        - name: LOCAL_DEV
          value: {{ .Values.global.allowLocalPublicUrl | default false | quote }}
        {{- with .Values.api.rateLimit }}
        - name: API_PUBLIC_RATE_PER_MINUTE
          value: {{ .perMinute | default 10 | quote }}
        - name: API_PUBLIC_RATE_BURST
          value: {{ .burst | default 5 | quote }}
        - name: API_TRUSTED_PROXIES
          value: {{ join "," (.trustedProxies | default list) | quote }}
        {{- end }}
        # POST /auth/change-password has its own budget (per client IP and per
        # account) because it accepts a password guess (#4822).
        - name: API_CHANGE_PASSWORD_RATE_PER_MINUTE
          value: {{ .Values.api.changePasswordRateLimit.perMinute | default 5 | quote }}
        - name: API_CHANGE_PASSWORD_RATE_BURST
          value: {{ .Values.api.changePasswordRateLimit.burst | default 3 | quote }}
        - name: SMTP_HOST
          value: "{{ .Values.smtp.host }}"
        - name: SMTP_PORT
          value: "{{ .Values.smtp.port }}"
        - name: SMTP_USERNAME
          value: "{{ .Values.smtp.username }}"
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.smtpSecretName" . }}
              key: {{ include "home-os.smtpSecretPasswordKey" . }}
              # An existingSecret without SMTP configured may omit the key.
              optional: true
        - name: SMTP_FROM
          value: "{{ .Values.smtp.from }}"
        - name: DEX_GRPC_ADDR
          value: "home-os-dex:5557"
        {{- include "home-os.dexGrpcClientEnv" . | nindent 8 }}
        - name: DEX_JWKS_URL
          value: "http://home-os-envoy.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.envoy.port }}/dex/keys"
        - name: DEX_ISSUER
          value: {{ include "home-os.dexIssuer" . | quote }}
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.secretsName" . }}
              key: adminEmail
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "home-os.secretsName" . }}
              key: adminPassword
        volumeMounts:
        {{- include "home-os.tmpVolumeMount" . | nindent 8 }}
        {{- if .Values.dex.grpcTLS.enabled }}
        {{- include "home-os.dexGrpcClientVolumeMount" . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
      volumes:
      {{- include "home-os.tmpVolume" . | nindent 6 }}
      {{- if .Values.dex.grpcTLS.enabled }}
      {{- include "home-os.dexGrpcClientVolume" . | nindent 6 }}
      {{- end }}
