apiVersion: batch/v1
kind: Job
metadata:
  name: home-os-migrations
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      {{- include "home-os.podSecurityContext" (dict "uid" 65532) | nindent 6 }}
      containers:
      - name: migrations
        image: "{{ .Values.global.imageRegistry }}/migrations:{{ include "home-os.imageTag" . }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        {{- include "home-os.containerSecurityContext" . | nindent 8 }}
        env:
        {{- include "home-os.databaseEnv" . | nindent 8 }}
        volumeMounts:
        {{- include "home-os.tmpVolumeMount" . | nindent 8 }}
      volumes:
      {{- include "home-os.tmpVolume" . | nindent 6 }}
