# Home OS — Docker Compose (Development)
# Single file, self-contained. All infrastructure and application services.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Demo account: admin@homeos.demo / demo1234 (seeded automatically)

name: homeos

services:

  # ──────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: homeos
      POSTGRES_USER: homeos
      POSTGRES_PASSWORD: homeos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeos -d homeos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    ports:
      - "8109:8108"
    environment:
      TYPESENSE_API_KEY: homeos-dev-key
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8108' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio:
    image: minio/minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────────────────────────
  # MIGRATIONS — runs once, exits
  # ──────────────────────────────────────────────────────────────

  migrations:
    build:
      context: ../packages/db
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://homeos:homeos@postgres:5432/homeos?sslmode=disable

  # ──────────────────────────────────────────────────────────────
  # APPLICATION SERVICES
  # ──────────────────────────────────────────────────────────────

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    command: go run ./cmd/api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ../apps/api:/app
      - api_gopath:/root/go/pkg/mod
    working_dir: /app
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://homeos:homeos@postgres:5432/homeos?sslmode=disable
      JWT_SECRET: homeos-dev-jwt-secret-change-in-prod
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: homeos-dev-key
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      INTEGRATION_ENCRYPTION_KEY: homeos-dev-enc-key-32-chars-xxxxx
      LOG_LEVEL: debug
      DEMO_MODE: "true"

  calendar:
    build:
      context: ../apps/calendar
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    command: go run ./cmd/calendar
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ../apps/calendar:/app
      - calendar_gopath:/root/go/pkg/mod
    working_dir: /app
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://homeos:homeos@postgres:5432/homeos?sslmode=disable
      CALENDAR_SECRET: homeos-dev-calendar-secret
      LOG_LEVEL: debug

  worker:
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    command: go run ./cmd/worker
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ../apps/worker:/app
      - worker_gopath:/root/go/pkg/mod
    working_dir: /app
    environment:
      DATABASE_URL: postgres://homeos:homeos@postgres:5432/homeos?sslmode=disable
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: homeos-dev-key
      POLL_INTERVAL: 5s
      LOG_LEVEL: debug

  ui:
    build:
      context: ../apps/ui
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../apps/ui:/app
      - ui_next:/app/.next
      - ui_node_modules:/app/node_modules
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_URL: http://api:8080

# ──────────────────────────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  typesense_data:
  minio_data:
  api_gopath:
  calendar_gopath:
  worker_gopath:
  ui_next:
  ui_node_modules:
