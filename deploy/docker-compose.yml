# Home OS — Docker Compose (Development)
# Single file, self-contained. All infrastructure and application services.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Open https://localhost:8443 and sign in through Dex with the demo account
# admin@homeos.demo / demo1234 (seeded by the API with DEMO_MODE=true and by
# deploy/dex/config.yaml as a Dex static password; dev only).

name: homeos

services:

  # ──────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: homeos
      POSTGRES_USER: homeos
      POSTGRES_PASSWORD: homeos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the data volume is first created: makes the `app` role
      # that migrations GRANT to (032_loans, 034_agent_tokens).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeos -d homeos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    ports:
      - "8109:8108"
    environment:
      TYPESENSE_API_KEY: homeos-dev-key
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8108' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ──────────────────────────────────────────────────────────────
  # Caddy — Reverse proxy with automatic SSL
  # ──────────────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - api
      - calendar
      - home-os-dex

  # ──────────────────────────────────────────────────────────────
  # Dex — OIDC provider (same pin as the Helm chart)
  # Config: deploy/dex/config.yaml (dev-only values, sqlite storage).
  # No host port: browsers reach it through Caddy at /dex, containers at
  # http://home-os-dex:5556 (HTTP) and home-os-dex:5557 (gRPC).
  # ──────────────────────────────────────────────────────────────

  home-os-dex:
    # Same pin as the Helm chart (dex.image). Must be >= v2.46.0 or the
    # oauth2.pkce block is dropped and Dex enforces nothing (#694).
    image: ghcr.io/dexidp/dex:v2.46.1
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      - dex_data:/var/dex
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ──────────────────────────────────────────────────────────────
  # Tika — OCR service for worker
  # ──────────────────────────────────────────────────────────────

  tika:
    image: apache/tika:4.2.0-1-full
    restart: unless-stopped
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────────
  # MIGRATIONS — runs once, exits
  # ──────────────────────────────────────────────────────────────

  migrations:
    build:
      context: ../packages/db
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://homeos:homeos@postgres:5432/homeos?sslmode=disable

  # ──────────────────────────────────────────────────────────────
  # APPLICATION SERVICES
  # ──────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: builder
    restart: unless-stopped
    command: go run ./cmd/api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      home-os-dex:
        condition: service_healthy
    volumes:
      - ../apps/api:/src/apps/api
      - ../packages/icalx:/src/packages/icalx
      - ../packages/billcal:/src/packages/billcal
      - ../packages/billdue:/src/packages/billdue
      - api_gopath:/go/pkg/mod
    working_dir: /src/apps/api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://homeos:homeos@postgres:5432/homeos?sslmode=disable
      LOCAL_DEV: "true"
      JWT_SECRET: homeos-dev-jwt-secret-change-in-prod
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: homeos-dev-key
      ENCRYPTION_KEY: homeos-dev-enc-key-32-chars-xxxxx
      LOG_LEVEL: debug
      DEMO_MODE: "true"
      PUBLIC_URL: https://localhost:8443
      # Must equal the issuer in deploy/dex/config.yaml (the iss claim in tokens).
      DEX_ISSUER: https://localhost:8443/dex
      DEX_JWKS_URL: http://home-os-dex:5556/dex/keys
      DEX_GRPC_ADDR: home-os-dex:5557

  calendar:
    build:
      context: ..
      dockerfile: apps/calendar/Dockerfile
      target: builder
    restart: unless-stopped
    command: go run ./cmd/calendar
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ../apps/calendar:/src/apps/calendar
      - ../packages/icalx:/src/packages/icalx
      - calendar_gopath:/go/pkg/mod
    working_dir: /src/apps/calendar
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://homeos:homeos@postgres:5432/homeos?sslmode=disable
      CALENDAR_SECRET: homeos-dev-calendar-secret
      LOG_LEVEL: debug

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      target: builder
    restart: unless-stopped
    command: go run ./cmd/worker
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ../apps/worker:/src/apps/worker
      - ../apps/api:/src/apps/api
      - ../packages/icalx:/src/packages/icalx
      - ../packages/billcal:/src/packages/billcal
      - ../packages/billdue:/src/packages/billdue
      - worker_gopath:/go/pkg/mod
    working_dir: /src/apps/worker
    environment:
      DATABASE_URL: postgres://homeos:homeos@postgres:5432/homeos?sslmode=disable
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: homeos-dev-key
      POLL_INTERVAL: 5s
      LOG_LEVEL: debug

  ui:
    build:
      context: ../apps/ui
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - api
      - home-os-dex
    volumes:
      - ../apps/ui:/app
      - ui_node_modules:/app/node_modules
    working_dir: /app
    environment:
      NODE_ENV: development
      # The BFF (apps/ui/app/bff/[...path]/route.ts) proxies /bff/* here.
      # Its default, http://home-os-api:8080, is the Kubernetes service name.
      API_INTERNAL_URL: http://api:8080
      # OIDC (apps/ui/lib/auth/dex-config.ts). The redirect URI must match the
      # home-os-ui client in deploy/dex/config.yaml exactly.
      PUBLIC_URL: https://localhost:8443
      DEX_UI_REDIRECT_URI: https://localhost:8443/api/auth/callback
      DEX_TOKEN_URL: http://home-os-dex:5556/dex/token

# ──────────────────────────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────────────────────────

volumes:
  postgres_data:
  typesense_data:
  caddy_data:
  caddy_config:
  dex_data:
  api_gopath:
  calendar_gopath:
  worker_gopath:
  ui_node_modules:
