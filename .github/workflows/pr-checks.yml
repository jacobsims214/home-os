name: PR Checks

on:
  pull_request:
    branches: [main, feat/family-hub]
  push:
    branches: [feat/family-hub]

# PRs: a newer push to the PR cancels the older run (only the latest commit
# matters). Pushes to feat/family-hub: one group per commit, never cancelled,
# so every push gets a complete run, e2e included. Parallel tickets push in
# bursts; with a per-ref group each push cancelled the previous run and e2e
# never finished (#4757).
concurrency:
  group: pr-checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # calendar, mcp and worker tests start their own Postgres through
  # testcontainers (Docker is on the runner). mcp's latency-sensitive tests
  # are flaky at default package parallelism, so they run with -p 4.
  # apps/mcp also gets a Typesense for its semantic search tests, which run
  # in their own step (matrix.typesense_tests) and are skipped in the main run.
  go-build:
    runs-on: ubuntu-latest
    env:
      TYPESENSE_TEST_ADDR: ${{ matrix.typesense_tests && '127.0.0.1:8108' || '' }}
      TYPESENSE_TEST_KEY: ${{ matrix.typesense_tests && 'homeos-ci-test-key' || '' }}
      TYPESENSE_TESTS: ${{ matrix.typesense_tests }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: apps/calendar
            parallel: ""
          - module: apps/mcp
            parallel: "-p 4"
            typesense_tests: "TestDocumentSemanticSearch|TestGuideFindByMeaning"
          - module: apps/worker
            parallel: ""
          - module: packages/billcal
            parallel: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      # Typesense (the stack's pinned 30.2) for the hybrid/semantic search
      # tests. Started with docker run rather than a services: block so the
      # embedding model cache below is restored into its data dir before the
      # server starts. TYPESENSE_TEST_KEY is a throwaway test value, not a
      # secret. The warm-up collection makes Typesense load (and on a cache
      # miss download, ~130 MB) ts/all-MiniLM-L12-v2 here, with its own
      # timeout, instead of inside the first test.
      - name: Restore Typesense embedding model cache
        if: matrix.typesense_tests != ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/typesense/models
          key: typesense-30.2-models-all-MiniLM-L12-v2
      - name: Start Typesense and load the embedding model
        if: matrix.typesense_tests != ''
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/typesense"
          docker run -d --name typesense --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:8108:8108 -v "$RUNNER_TEMP/typesense:/data" \
            typesense/typesense:30.2 --api-key="$TYPESENSE_TEST_KEY" --data-dir=/data
          for i in $(seq 1 60); do
            if curl -fsS "http://$TYPESENSE_TEST_ADDR/health" 2>/dev/null | grep -q '"ok":true'; then break; fi
            if [ "$i" = 60 ]; then echo "Typesense not healthy after 120 s"; docker logs typesense; exit 1; fi
            sleep 2
          done
          echo "Typesense healthy; loading ts/all-MiniLM-L12-v2"
          start=$(date +%s)
          curl -fsS -m 540 -X POST "http://$TYPESENSE_TEST_ADDR/collections" \
            -H "X-TYPESENSE-API-KEY: $TYPESENSE_TEST_KEY" -H 'Content-Type: application/json' \
            -d '{"name":"ci_warmup","fields":[{"name":"t","type":"string"},{"name":"e","type":"float[]","embed":{"from":["t"],"model_config":{"model_name":"ts/all-MiniLM-L12-v2"}}}]}' \
            >/dev/null || { docker logs typesense 2>&1 | tail -50; exit 1; }
          curl -fsS -X DELETE "http://$TYPESENSE_TEST_ADDR/collections/ci_warmup" \
            -H "X-TYPESENSE-API-KEY: $TYPESENSE_TEST_KEY" >/dev/null
          echo "Embedding model ready in $(( $(date +%s) - start )) s"
      - run: go test ${{ matrix.parallel }} ${TYPESENSE_TESTS:+-skip "^($TYPESENSE_TESTS)\$"} ./...
        working-directory: ${{ matrix.module }}
      # Fails if any Typesense test does not PASS, so a lost env var or a
      # down Typesense cannot turn them into silent SKIPs.
      - name: Typesense search tests (must PASS, not SKIP)
        if: matrix.typesense_tests != ''
        working-directory: ${{ matrix.module }}
        run: |
          set -o pipefail
          go test -count=1 -v -run "^($TYPESENSE_TESTS)$" ./internal/file ./internal/guides | tee "$RUNNER_TEMP/typesense-tests.log"
          for t in ${TYPESENSE_TESTS//|/ }; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/typesense-tests.log" || { echo "::error::$t did not PASS (skipped or missing)"; exit 1; }
          done

  # apps/api integration tests read TEST_DATABASE_URL (a migrated database)
  # and share it, so packages run one at a time (-p 1). The Typesense tests
  # (per-test collections, #4773) run in their own step against a real
  # Typesense and are skipped in the main run.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/homeos_test?sslmode=disable
      TYPESENSE_TEST_ADDR: 127.0.0.1:8108
      TYPESENSE_TEST_KEY: homeos-ci-test-key
      TYPESENSE_TESTS: TestDocumentHybridSearch|TestGuideHybridSearchIntegration|TestTypesenseHybridIntegration|TestNoteHitsFollowParentIntegration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      # Migrations GRANT to the application role, which the real database has.
      - name: Create app role and apply migrations
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE app"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/packages/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 -path /migrations -database "$TEST_DATABASE_URL" up
      - run: go build ./...
        working-directory: apps/api
      - run: go vet ./...
        working-directory: apps/api
      # Typesense (the stack's pinned 30.2) for the hybrid/semantic search
      # tests. Started with docker run rather than a services: block so the
      # embedding model cache below is restored into its data dir before the
      # server starts. TYPESENSE_TEST_KEY is a throwaway test value, not a
      # secret. The warm-up collection makes Typesense load (and on a cache
      # miss download, ~130 MB) ts/all-MiniLM-L12-v2 here, with its own
      # timeout, instead of inside the first test.
      - name: Restore Typesense embedding model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/typesense/models
          key: typesense-30.2-models-all-MiniLM-L12-v2
      - name: Start Typesense and load the embedding model
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/typesense"
          docker run -d --name typesense --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:8108:8108 -v "$RUNNER_TEMP/typesense:/data" \
            typesense/typesense:30.2 --api-key="$TYPESENSE_TEST_KEY" --data-dir=/data
          for i in $(seq 1 60); do
            if curl -fsS "http://$TYPESENSE_TEST_ADDR/health" 2>/dev/null | grep -q '"ok":true'; then break; fi
            if [ "$i" = 60 ]; then echo "Typesense not healthy after 120 s"; docker logs typesense; exit 1; fi
            sleep 2
          done
          echo "Typesense healthy; loading ts/all-MiniLM-L12-v2"
          start=$(date +%s)
          curl -fsS -m 540 -X POST "http://$TYPESENSE_TEST_ADDR/collections" \
            -H "X-TYPESENSE-API-KEY: $TYPESENSE_TEST_KEY" -H 'Content-Type: application/json' \
            -d '{"name":"ci_warmup","fields":[{"name":"t","type":"string"},{"name":"e","type":"float[]","embed":{"from":["t"],"model_config":{"model_name":"ts/all-MiniLM-L12-v2"}}}]}' \
            >/dev/null || { docker logs typesense 2>&1 | tail -50; exit 1; }
          curl -fsS -X DELETE "http://$TYPESENSE_TEST_ADDR/collections/ci_warmup" \
            -H "X-TYPESENSE-API-KEY: $TYPESENSE_TEST_KEY" >/dev/null
          echo "Embedding model ready in $(( $(date +%s) - start )) s"
      - run: go test -p 1 -skip "^($TYPESENSE_TESTS)$" ./...
        working-directory: apps/api
      # Fails if any Typesense test does not PASS, so a lost env var or a
      # down Typesense cannot turn them into silent SKIPs.
      - name: Typesense search tests (must PASS, not SKIP)
        working-directory: apps/api
        run: |
          set -o pipefail
          go test -count=1 -v -run "^($TYPESENSE_TESTS)$" ./internal/file ./internal/guides ./internal/search | tee "$RUNNER_TEMP/typesense-tests.log"
          for t in ${TYPESENSE_TESTS//|/ }; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/typesense-tests.log" || { echo "::error::$t did not PASS (skipped or missing)"; exit 1; }
          done

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
        working-directory: apps/ui
      - run: npm run build
        working-directory: apps/ui

  # Playwright suite (phone projects + desktop-chrome) against the production
  # (standalone) build, with e2e/stub-server.mjs standing in for Dex and the
  # Go API. playwright.config.ts gives CI one retry and an HTML report.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ui
    env:
      CI: "true"
      E2E_UI: standalone
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose -f deploy/docker-compose.yml config -q
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npm run build
      - run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/ui/e2e/.report
            apps/ui/e2e/.results
          retention-days: 14
          if-no-files-found: ignore

  # MCP latency benchmark (KB testing/mcp-latency-benchmark.md): every tool over
  # the authed /mcp handler against a seeded household, p95 budget 100 ms. Its
  # own job so it does not compete with other tests for the runner's CPU. On a
  # failure the test error lists p95 for every tool; the full report goes to
  # the job summary either way.
  mcp-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/mcp/go.sum
      - name: Run benchmark
        run: make -C apps/mcp bench BENCH_REPORT="$RUNNER_TEMP/bench-report.md"
      - name: Report to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bench-report.md" ]; then
            cat "$RUNNER_TEMP/bench-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark report was written; see the Run benchmark log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-bench-report
          path: ${{ runner.temp }}/bench-report.md
          if-no-files-found: ignore

  helm-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      - run: helm template deploy/helm/home-os --set global.publicUrl=https://homeos.example.com --set global.imageTag=sha-0000000
