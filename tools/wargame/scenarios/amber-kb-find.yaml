# War-game scenario - written for R4 from #5505 (household reality); not played yet.
# Do not edit the prose of `intent` to match new behavior: change the assertion.
#
# Two ways into one doc: the reference search in the UI (GET /api/v1/kb?q=, which
# ranks by meaning through Typesense) and the agent's kb_search. The seed's
# how-to/networking/router-reset is deliberately worded without "reset the wifi"
# nowhere-to-be-seen phrasing, so a literal word match on the question is not
# enough - "how do I reset the router" must find it by meaning, and if meaning
# search is degraded the tools must say so rather than answer "no such doc".
id: amber-kb-find
persona: amber
surface: guides
intent: |
  The wifi is out and Jacob is at work. How do I reset the router?
steps:
  - "open https://homeos.simstech.cloud as amber at 390x844 -> Guides -> Reference"
  - "type 'reset the router' in the Search the family reference box and read the result rows"
  - "open the top result and read its path and body"
  - "chat.sh amber r4-kb --file msg (ask how to reset the router, without naming a doc or a tool)"
  - mcpcall.py kb_search with query 'the wifi went out, how do I reset the router' as amber
  - mcpcall.py kb_list as amber
assertion: |
  Both routes land on the same path: how-to/networking/router-reset. The UI's
  top result link points at /dashboard/guides/reference/how-to/networking/router-reset
  and the page body contains the seeded steps ("Unplug the power, wait 30
  seconds") - not just a title match. kb_search returns that path in its hits,
  and the agent's reply names the same doc and quotes at least one instruction
  that appears verbatim in kb_get of that path (for example the 30-second wait or
  the Northlight Fiber number 555-0175); it does not invent a step and does not
  answer that the family has no such doc. kb_list contains the path, so
  "not found" is a failed scenario rather than a plausible empty answer. If
  meaning search is impaired the reply must say search is impaired and fall back
  to kb_list - an empty result presented as "we have nothing" fails.
tags:
  - guides
  - kb
  - search
  - agent
  - meaning-search
origin:
  round: r4
  source: "#5505"
  ref: household-reality/7
  ticket: "#5505"
  date: "2026-11-23"
  verdict: untested
