id: jacob-fall-teacher-contact-guide
persona: jacob
surface: guides
channel: both
intent: |
  Maya's teacher wants to talk about the reading group. Write down what to ask her and
  how we reach her, as a how-to I can open the night before the conference.
steps:
  - "chat.sh jacob teacher --stdin with the message above"
  - "mcpcall.py contact_find with query 'Riverside Elementary' as jacob"
  - "mcpcall.py guide_create attached to Maya (or to the household) as jacob"
