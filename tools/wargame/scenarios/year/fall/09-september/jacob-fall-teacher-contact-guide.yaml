  A guide exists whose body names the teacher conference and whose contact details are
  the school vendor's own phone and email from contact_find - no figure or address
  that is not in a payload. guide_find returns it in one call, and it is attached to
  Maya rather than floating unattached, because a guide nobody can find from the
  child's page is a document nobody reads.
parity: |
  the teacher's phone number: contact_find's phone for Riverside Elementary, the
  number in the guide's body and the number the guide page renders are the same digits
